[project]
name = "project-memory-mcp-live"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kumarchandan125", email = "chandanpandey6048178@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=4.1.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
project-memory-mcp-live = "project_memory_mcp_live:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
